name: Aurora LuaLaTeX production renderer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aurora-lualatex-production.yml"
      - "infra/lualatex/render_document.py"
      - "infra/lualatex/aurore_svg.py"
      - "infra/geogebra/render_missing_graphs.mjs"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Course quality is enforced in Supabase before a document enters the LuaLaTeX queue.
# GeoGebra renderer v3 regression validation uses existing generated documents only.
# Production-only trigger: validate the Terminale C matrix document.
concurrency:
  group: aurora-lualatex-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://tdeotqfsbvouresfhkab.supabase.co
      AURORA_LUALATEX_RENDER_TOKEN: ${{ secrets.AURORA_LUALATEX_RENDER_TOKEN }}

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Validate renderer secret
        run: test -n "$AURORA_LUALATEX_RENDER_TOKEN"

      - name: Validate renderer Python syntax
        working-directory: infra/lualatex
        run: python3 -m py_compile render_document.py aurore_svg.py

      - name: Validate GeoGebra renderer JavaScript syntax
        run: node --check infra/geogebra/render_missing_graphs.mjs

      - name: Smoke-test math normalization
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import render_document
          from render_document import normalize_math, _math_visual_plan_qa, _geogebra_visual_plan_qa, _exercise_geogebra_plan_qa, _documentary_visual_plan_qa

          regressions = [
              (r"\fracrac3{(x-1)^2}", r"\frac3{(x-1)^2}"),
              (r"lim_{x\to1}sqrt{x^2+1}", r"\lim_{x\to1}\sqrt{x^2+1}"),
              (r"left(1,2\right)", r"\left(1,2\right)"),
              (r"ln(1+x)+infty", r"\ln(1+x)+\infty"),
              (r"ainmathbb R", r"a\in\mathbb R"),
              (r"mathbb Rsetminus{a}", r"\mathbb R\setminus{a}"),
              (r"widetilde f(a)=quad x", r"\widetilde f(a)=\quad x"),
              ("\f" + "rac{1}{2}", r"\frac{1}{2}"),
              ("\t" + "ext{x}", r"\text{x}"),
          ]
          for raw, expected in regressions:
              actual = normalize_math(raw)
              if actual != expected:
                  raise SystemExit(f"Math normalization regression: {actual!r}, expected {expected!r}")
          malformed_inline = (
              r"Calcul 66. Le dénominateur tend vers $0^-,$" + "$"
              + r" donc $" + "$" + r"-\\infty." + "$" + "$"
              + r" À droite, " + "$" + "$" + r"+\\infty." + "$" + "$"
          )
          rendered_inline = render_document.inline(malformed_inline)
          if "$" in rendered_inline:
              raise SystemExit(f"Inline dollar regression: stray dollar delimiter remains: {rendered_inline!r}")
          if r"\[-\infty.\]" not in rendered_inline or r"\[+\infty.\]" not in rendered_inline:
              raise SystemExit(f"Inline display-dollar regression: display math was not preserved: {rendered_inline!r}")
          math_course = {
              "subject": "Mathématiques",
              "document_type": "cours",
              "sections": [{
                  "title": "Fonctions",
                  "content": ["Étude et représentation d'une fonction."],
                  "graphs": [{
                      "id": "f1",
                      "title": "Courbe de la fonction carrée",
                      "purpose": "Lire l'allure et les variations.",
                      "instrument": "function2d",
                      "expression": "x^2",
                      "graph_local_path": "assets/graph-1-1.png",
                      "geogebra_image_path": "aurore-content/test/f1.png"
                  }]
              }],
              "visual_plan": {
                  "schema_version": "math-visual-plan-1",
                  "decisions": [{
                      "section_number": 1,
                      "decision": "build",
                      "rationale": "Courbe centrale pour interpréter la fonction.",
                      "graph_ids": ["f1"]
                  }]
              }
          }
          qa = _math_visual_plan_qa(math_course)
          if qa.get("planned_graphs") != 1:
              raise SystemExit(f"Math visual plan smoke test failed: {qa!r}")
          broken = dict(math_course)
          broken["visual_plan"] = {"schema_version": "math-visual-plan-1", "decisions": []}
          try:
              _math_visual_plan_qa(broken)
          except ValueError:
              pass
          else:
              raise SystemExit("Math visual plan smoke test failed: missing decision was accepted.")
          legacy_course = {
              "title": "Ancien cours de coniques",
              "subject": "Mathématiques",
              "document_type": "cours",
              "sections": [{
                  "title": "Parabole",
                  "content": ["Une parabole est l'ensemble des points définis par une relation quadratique."]
              }]
          }
          legacy_qa = _math_visual_plan_qa(legacy_course)
          if not legacy_qa.get("legacy") or legacy_qa.get("enabled"):
              raise SystemExit(f"Legacy renderer compatibility smoke test failed: {legacy_qa!r}")

          history_course = {
              "title": "Hitler et l'Allemagne nazie",
              "subject": "Histoire",
              "document_type": "cours",
              "metadata": {"origin": "gpt_editorial_ingest"},
              "sections": [{
                  "title": "Repères historiques",
                  "content": ["Hitler et l'arrivée du nazisme au pouvoir."],
                  "visuals": [{
                      "id": "hitler-portrait",
                      "type": "wikimedia",
                      "query": "Adolf Hitler portrait historical",
                      "title": "Portrait historique d'Adolf Hitler",
                      "caption": "Document historique permettant d'identifier la figure politique étudiée.",
                      "purpose": "photo",
                      "required": True
                  }]
              }],
              "visual_plan": {
                  "schema_version": "documentary-visual-plan-1",
                  "decisions": [{
                      "section_number": 1,
                      "decision": "build",
                      "rationale": "Le document historique facilite l'identification du personnage étudié.",
                      "visual_ids": ["hitler-portrait"]
                  }]
              }
          }

          exercise_sheet = {
              "title": "Fonctions — série d'exercices",
              "subject": "Mathématiques",
              "document_type": "exercices",
              "metadata": {"origin": "gpt_editorial_ingest"},
              "sections": [{
                  "title": "Courbes",
                  "exercises": [{
                      "question": "Étudier puis tracer la courbe de f.",
                      "statement_graphs": [],
                      "correction_graphs": [{
                          "id": "corr-f1",
                          "title": "Construction de la courbe de f",
                          "purpose": "Vérifier graphiquement la représentation obtenue.",
                          "instrument": "function2d",
                          "expression": "x^2-2*x",
                          "graph_local_path": "assets/geogebra/exercise-1-correction-1.png",
                          "geogebra_image_path": "aurora-content/test/exercise-corr-f1.png"
                      }]
                  }, {
                      "question": "Résoudre l'exercice sans construction graphique.",
                      "statement_graphs": [],
                      "correction_graphs": []
                  }]
              }],
              "exercise_geogebra_plan": {
                  "schema_version": "exercise-geogebra-plan-1",
                  "decisions": [{
                      "exercise_number": 1,
                      "statement": {"decision": "not_needed", "rationale": "La construction est demandée à l'élève."},
                      "correction": {"decision": "build", "rationale": "Le graphique aide à vérifier la construction.", "graph_ids": ["corr-f1"]}
                  }, {
                      "exercise_number": 2,
                      "statement": {"decision": "not_needed", "rationale": "Aucune donnée graphique n'est nécessaire."},
                      "correction": {"decision": "not_needed", "rationale": "Le résultat est algébrique et le graphique n'apporte rien."}
                  }]
              }
          }
          exercise_qa = _exercise_geogebra_plan_qa(exercise_sheet)
          if exercise_qa.get("planned_graphs") != 1 or not exercise_qa.get("enabled"):
              raise SystemExit(f"Exercise GeoGebra plan smoke test failed: {exercise_qa!r}")

          broken_exercise = dict(exercise_sheet)
          broken_exercise["exercise_geogebra_plan"] = {
              "schema_version": "exercise-geogebra-plan-1",
              "decisions": [{
                  "exercise_number": 1,
                  "statement": {"decision": "build", "rationale": "Construction prévue.", "graph_ids": ["corr-f1"]},
                  "correction": {"decision": "not_needed", "rationale": "Pas de correction graphique."}
              }]
          }
          try:
              _exercise_geogebra_plan_qa(broken_exercise)
          except ValueError:
              pass
          else:
              raise SystemExit("Exercise GeoGebra plan smoke test failed: decision count mismatch was accepted.")

          unsupported_exercise = {
              "title": "Histoire — série",
              "subject": "Histoire",
              "document_type": "exercices",
              "metadata": {"origin": "gpt_editorial_ingest"},
              "sections": [{
                  "title": "Cartographie",
                  "exercises": [{
                      "question": "Lire la carte.",
                      "statement_graphs": [{
                          "id": "h1",
                          "title": "Carte",
                          "purpose": "Support de lecture.",
                          "instrument": "function2d",
                          "expression": "x"
                      }],
                      "correction_graphs": []
                  }]
              }],
              "exercise_geogebra_plan": {"schema_version": "exercise-geogebra-plan-1", "decisions": [{
                  "exercise_number": 1,
                  "statement": {"decision": "build", "rationale": "La représentation est nécessaire.", "graph_ids": ["h1"]},
                  "correction": {"decision": "not_needed", "rationale": "Pas de graphique en correction."}
              }]}
          }
          try:
              _exercise_geogebra_plan_qa(unsupported_exercise)
          except ValueError:
              pass
          else:
              raise SystemExit("Exercise GeoGebra plan smoke test failed: unsupported subject was accepted.")

          documentary_qa = _documentary_visual_plan_qa(history_course)
          if documentary_qa.get("planned_visuals") != 1 or not documentary_qa.get("enabled"):
              raise SystemExit(f"Documentary visual plan smoke test failed: {documentary_qa!r}")

          physics_course = {
              "title": "Forces et mouvement",
              "subject": "Physique",
              "document_type": "cours",
              "metadata": {"origin": "gpt_editorial_ingest"},
              "sections": [{
                  "title": "Forces",
                  "content": ["Une force est une grandeur vectorielle qui peut être représentée par une flèche."],
                  "visuals": [{
                      "id": "physics-apparatus",
                      "type": "wikimedia",
                      "query": "physics spring laboratory apparatus",
                      "title": "Dispositif expérimental",
                      "caption": "Photographie documentaire du dispositif utilisé pour relier l'observation au modèle.",
                      "purpose": "experimental",
                      "required": True
                  }],
                  "graphs": [{
                      "id": "force-poids",
                      "title": "Vecteur poids",
                      "purpose": "Représenter direction et sens du poids.",
                      "instrument": "geometry2d",
                      "objects": [{
                          "type": "vector",
                          "from": [0, 0],
                          "to": [0, -4]
                      }],
                      "x_min": -5,
                      "x_max": 5,
                      "y_min": -5,
                      "y_max": 5,
                      "graph_local_path": "assets/geogebra/force-poids.png",
                      "geogebra_image_path": "aurora-content/test/force-poids.png"
                  }]
              }],
              "visual_plan": {
                  "schema_version": "documentary-visual-plan-1",
                  "decisions": [{
                      "section_number": 1,
                      "decision": "build",
                      "rationale": "La photographie situe le dispositif réel étudié.",
                      "visual_ids": ["physics-apparatus"]
                  }]
              },
              "geogebra_plan": {
                  "schema_version": "geogebra-visual-plan-1",
                  "decisions": [{
                      "section_number": 1,
                      "decision": "build",
                      "rationale": "Le vecteur rend la force immédiatement lisible.",
                      "graph_ids": ["force-poids"]
                  }]
              }
          }
          geogebra_qa = _geogebra_visual_plan_qa(physics_course)
          if geogebra_qa.get("planned_graphs") != 1 or not geogebra_qa.get("enabled"):
              raise SystemExit(f"Physics GeoGebra plan smoke test failed: {geogebra_qa!r}")

          broken_physics = dict(physics_course)
          broken_physics["geogebra_plan"] = {
              "schema_version": "geogebra-visual-plan-1",
              "decisions": []
          }
          try:
              _geogebra_visual_plan_qa(broken_physics)
          except ValueError:
              pass
          else:
              raise SystemExit("Physics GeoGebra plan smoke test failed: missing decision was accepted.")

          broken_documentary = dict(history_course)
          broken_documentary["visual_plan"] = {
              "schema_version": "documentary-visual-plan-1",
              "decisions": []
          }
          try:
              _documentary_visual_plan_qa(broken_documentary)
          except ValueError:
              pass
          else:
              raise SystemExit("Documentary visual plan smoke test failed: missing decision was accepted.")

          legacy_history = {
              "title": "Ancien cours d'histoire",
              "subject": "Histoire",
              "document_type": "cours",
              "sections": [{
                  "title": "La Révolution française",
                  "content": ["Un ancien document sans nouveau contrat documentaire."]
              }]
          }
          legacy_history_qa = _documentary_visual_plan_qa(legacy_history)
          if not legacy_history_qa.get("legacy") or legacy_history_qa.get("enabled"):
              raise SystemExit(f"Legacy documentary compatibility smoke test failed: {legacy_history_qa!r}")

          math_with_wikimedia = {
              "title": "Ancien cours de fonctions",
              "subject": "Mathématiques",
              "document_type": "cours",
              "sections": [{
                  "title": "Fonctions",
                  "content": ["Étude graphique d'une fonction."],
                  "visuals": [{
                      "id": "bad-math-photo",
                      "type": "wikimedia",
                      "query": "mathematics graph",
                      "title": "Illustration",
                      "caption": "Visuel documentaire accidentel.",
                      "purpose": "illustration",
                      "required": True
                  }]
              }]
          }
          math_wikimedia_qa = _documentary_visual_plan_qa(math_with_wikimedia)
          if math_wikimedia_qa.get("enabled") or math_wikimedia_qa.get("ignored_documentary_visuals") != 1:
              raise SystemExit(f"Math documentary exclusion smoke test failed: {math_wikimedia_qa!r}")
          PY

      - name: Claim next generated document
        run: |
          mkdir -p infra/lualatex/production
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            --header "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-next" \
            -o infra/lualatex/production/claim.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("infra/lualatex/production/claim.json").read_text())
          if not data.get("ok"):
              raise SystemExit(f"Claim failed: {data}")
          if not data.get("pending"):
              print("No generated document waiting for LuaLaTeX.")
              Path("infra/lualatex/production/no-work").write_text("true")
              raise SystemExit(0)
          doc = data["document"]
          print(f"Claimed document {doc['id']}: {doc['title']}")
          Path("infra/lualatex/production/document-id").write_text(str(doc["id"]))
          PY

      - name: Mark queue processing
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":5,\"stage\":\"Document pris en charge par LuaLaTeX\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Fetch claimed document JSON
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            --header "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-source?document_id=$DOCUMENT_ID" \
            -o infra/lualatex/production/document-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path("infra/lualatex/production/document-response.json").read_text())
          document = src.get("document")
          if not document or "content_json" not in document:
              raise SystemExit("Source endpoint did not return document.content_json")
          payload = json.loads(Path("infra/lualatex/production/document-response.json").read_text())
          content = document["content_json"] if isinstance(document["content_json"], dict) else {}
          existing_identity = content.get("_aurore_document") if isinstance(content.get("_aurore_document"), dict) else {}
          content["_aurore_document"] = {
              **existing_identity,
              "id": int(document["id"]),
              "created_at": document.get("created_at"),
              "version": int(document.get("version") or 1),
              "title": document.get("title"),
          }
          # Preserve classification/visual metadata alongside content_json.
          # The renderer receives content_json as its document.json, so these
          # fields must not be lost when the source is fetched from Supabase.
          # Category is a hard contract: courses and exercise sheets must keep
          # their editorial path through generation and regeneration.
          for key in (
              "subject", "matiere", "level", "class_name", "document_type",
              "theme_color", "themeColor", "domaine", "formation",
              "specialite", "annee", "semestre", "filiere"
          ):
              if document.get(key) is not None and key not in content:
                  content[key] = document.get(key)
          if isinstance(document.get("metadata"), dict):
              for key in ("visual_plan", "visuals", "aurore_design"):
                  if key in document["metadata"] and key not in content:
                      content[key] = document["metadata"][key]
          graph_assets = payload.get("graph_assets") or []
          if graph_assets:
              from urllib.request import urlopen
              assets_dir = Path("infra/lualatex/production/assets")
              assets_dir.mkdir(parents=True, exist_ok=True)
              for asset in graph_assets:
                  si = int(asset["section_index"])
                  gi = int(asset["graph_index"])
                  url = str(asset["url"])
                  ext = Path(str(asset.get("path") or "")).suffix or ".png"
                  local = assets_dir / f"graph-{si+1}-{gi+1}{ext}"
                  with urlopen(url, timeout=30) as response:
                      local.write_bytes(response.read())
                  content["sections"][si]["graphs"][gi]["graph_local_path"] = str(local.relative_to(Path("infra/lualatex/production")))
                  print(f"Fetched GeoGebra asset: {local}")
          Path("infra/lualatex/production/document.json").write_text(
              json.dumps(content, ensure_ascii=False, indent=2)
          )
          print(f"Fetched {document['id']}: {document['title']} (GeoGebra assets: {len(graph_assets)})")
          PY

      - name: Detect missing GeoGebra assets
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("production/document.json").read_text())
          def valid(g):
              if not isinstance(g, dict):
                  return False
              instrument=str(g.get("instrument") or g.get("graph_type") or "").lower().strip()
              aliases={"function":"function2d","graph":"function2d","courbe":"function2d","complex_plane":"complex_plane","parametric":"parametric2d","geometry2d":"geometry2d","vector2d":"geometry2d","plan2d":"geometry2d","geometrie3d":"geometry3d","3d":"geometry3d"}
              instrument=aliases.get(instrument,instrument)
              points=g.get("points") if isinstance(g.get("points"),list) else []
              objects=g.get("objects") if isinstance(g.get("objects"),list) else []
              poi=g.get("points_of_interest") if isinstance(g.get("points_of_interest"),list) else []
              expr=str(g.get("expression") or "").strip()
              x=str(g.get("x_expression") or "").strip()
              y=str(g.get("y_expression") or "").strip()
              z=str(g.get("z_expression") or "").strip()
              asym=g.get("asymptotes") if isinstance(g.get("asymptotes"),list) else []
              if instrument in ("function2d","complex_plane"): return bool(expr or asym or any(isinstance(p,list) and len(p)==2 for p in points))
              if instrument=="parametric2d": return bool(x and y)
              if instrument=="parametric3d": return bool(x and y and z)
              if instrument=="surface3d": return bool(expr)
              if instrument=="geometry2d":
                  valid_types={"point","vector","line","segment","ray","polygon"}
                  return any(isinstance(o,dict) and str(o.get("type") or "").lower() in valid_types for o in objects) or any(isinstance(p,list) and len(p)>=2 for p in points)
              if instrument=="geometry3d":
                  valid_types={"point","vector","line","plane","sphere","cylinder","cone","polygon","cube","prism","pyramid","tetrahedron"}
                  return any(isinstance(o,dict) and str(o.get("type") or "").lower() in valid_types for o in objects) or any(isinstance(p,list) and len(p)>=3 for p in points) or any(isinstance(p,dict) and p.get("z") is not None for p in poi)
              if not instrument:
                  return bool(expr or (x and y) or (x and y and z) or asym or points or objects or poi)
              return False

          def ready(g):
              path=str(g.get("geogebra_image_path") or "").strip()
              source=str(g.get("geogebra_image_source") or "").lower()
              version=int(g.get("geogebra_renderer_version") or 0)
              if not path or source!="geogebra": return False
              return version >= 3
          def all_graphs(data):
              for section in data.get("sections") or []:
                  for graph in section.get("graphs") or []:
                      yield graph
                  for exercise in section.get("exercises") or []:
                      for graph in exercise.get("statement_graphs") or []:
                          yield graph
                      for graph in exercise.get("correction_graphs") or []:
                          yield graph
              for correction in data.get("corrections") or []:
                  for graph in correction.get("graphs") or []:
                      yield graph

          missing=0
          total=0
          for g in all_graphs(data):
              if valid(g):
                  total+=1
                  missing+=0 if ready(g) else 1
          print(f"GeoGebra préflight: {total-missing}/{total} asset(s) prêts; {missing} manquant(s).")
          if missing:
              Path("production/geogebra-required").write_text(str(missing))
          else:
              Path("production/geogebra-required").unlink(missing_ok=True)
          PY

      - name: Render missing GeoGebra assets server-side
        if: hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/geogebra-required') != ''
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          DOCUMENT_ID="$DOCUMENT_ID" node infra/geogebra/render_missing_graphs.mjs

      - name: Verify GeoGebra assets before LaTeX
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("production/document.json").read_text())
          from render_document import _is_renderable_geogebra_graph as valid

          def ready(g):
              path=str(g.get("geogebra_image_path") or "").strip()
              source=str(g.get("geogebra_image_source") or "").lower()
              version=int(g.get("geogebra_renderer_version") or 0)
              if not path or source!="geogebra": return False
              return version >= 3
          def all_graphs(data):
              for section in data.get("sections") or []:
                  for graph in section.get("graphs") or []:
                      yield graph
                  for exercise in section.get("exercises") or []:
                      for graph in exercise.get("statement_graphs") or []:
                          yield graph
                      for graph in exercise.get("correction_graphs") or []:
                          yield graph
              for correction in data.get("corrections") or []:
                  for graph in correction.get("graphs") or []:
                      yield graph

          missing=[]
          total=0
          index=0
          for g in all_graphs(data):
              if valid(g):
                  total+=1
                  if not ready(g): missing.append(index)
              index+=1
          print(f"GeoGebra vérification: {total-len(missing)}/{total} asset(s) prêts.")
          if missing:
              raise SystemExit("GeoGebra asset(s) manquant(s) avant LuaLaTeX: "+",".join(str(x+1) for x in missing))
          PY

      - name: Mark source ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |

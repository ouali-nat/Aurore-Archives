      - name: Prepare native LaTeX source layout and engine
        if: success() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/document.json') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path("production")
          source = root / "document.tex"
          original = source.read_text(encoding="utf-8")

          def strip_comments(line: str) -> str:
              for i, char in enumerate(line):
                  if char == "%" and (i == 0 or line[i - 1] != chr(92)):
                      return line[:i]
              return line

          def active_text(value: str) -> str:
              return "\n".join(strip_comments(line) for line in value.splitlines())

          active = active_text(original)
          class_match = re.search(r"\\documentclass(?:\[[^\]]*\])?\{([^}]+)\}", active)
          document_class = class_match.group(1).strip() if class_match else ""

          # Restore directory-qualified references that were flattened in the storage manifest.
          available = {p.name: p for p in root.iterdir() if p.is_file()}
          queue = [p for p in root.glob("*.tex")]
          seen = set()

          ref_pattern = re.compile(
              r"\\(?:input|include|includegraphics|lstinputlisting)\s*\{([^}]+)\}"
          )
          while queue:
              current = queue.pop(0)
              key = str(current.resolve())
              if key in seen:
                  continue
              seen.add(key)
              try:
                  text = active_text(current.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError):
                  continue

              for ref in ref_pattern.findall(text):
                  ref = ref.strip()
                  if "/" not in ref or ref.startswith("/") or ".." in Path(ref).parts:
                      continue
                  destination = root / ref
                  candidates = [root / ref]
                  if not destination.suffix:
                      candidates.append(root / (ref + ".tex"))

                  candidate = next((p for p in candidates if p.is_file()), None)
                  if candidate is None:
                      basename = Path(ref).name
                      fallback = available.get(basename)
                      if fallback is not None:
                          candidate = fallback
                      elif not Path(ref).suffix:
                          fallback = available.get(basename + ".tex")
                          if fallback is not None:
                              candidate = fallback

                  if candidate is None:
                      continue

                  if not destination.suffix and candidate.suffix:
                      destination = destination.with_suffix(candidate.suffix)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if not destination.exists():
                      shutil.copy2(candidate, destination)
                      queue.append(destination)
                      print(f"Restored native source path: {destination.relative_to(root)}")

          native = root / "native-entrypoint.tex"
          if not class_match:
              native.write_text(original, encoding="utf-8")
              wrapper = (
                  r"\documentclass{sesamanuel}" + "\n"
                  + r"\begin{document}" + "\n"
                  + r"\input{native-entrypoint.tex}" + "\n"
                  + r"\end{document}" + "\n"
              )
              source.write_text(wrapper, encoding="utf-8")
              engine = "xelatex"
              kind = "fragment"
          elif document_class.lower() == "sesamanuel":
              engine = "xelatex"
              kind = "sesamanuel"
          else:
              engine = "lualatex"
              kind = "complete"

          (root / "native-tex-engine").write_text(engine + "\n", encoding="utf-8")
          (root / "native-tex-kind").write_text(kind + "\n", encoding="utf-8")
          print(f"Native LaTeX preparation: class={document_class or 'none'} kind={kind} engine={engine}")
          PY
          ENGINE="$(cat production/native-tex-engine)"
          command -v "$ENGINE" >/dev/null 2>&1
          test -s production/document.tex

      - name: Persist visual QA
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          DOCUMENT_ID="$(cat production/document-id)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa_path=Path("production/document.visual-qa.json")
          if not qa_path.is_file():
              raise SystemExit("Visual QA sidecar missing")
          qa=json.loads(qa_path.read_text(encoding="utf-8"))
          body={"document_id":int(Path("production/document-id").read_text().strip()),"progress":40,"stage":"QA visuelle Wikimedia","metadata_patch":{"visual_qa":qa}}
          Path("production/visual-qa-progress.json").write_text(json.dumps(body,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(qa,ensure_ascii=False))
          PY
          curl --fail --silent --show-error -X POST             -H "Content-Type: application/json"             -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN"             --data-binary @production/visual-qa-progress.json             "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null
          echo "Visual QA persisted in Supabase."

      - name: Verify GeoGebra inclusion in LaTeX source
        if: hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/structured-document') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from render_document import _is_renderable_geogebra_graph

          data = json.loads(Path("production/document.json").read_text())
          tex = Path("production/document.tex").read_text(encoding="utf-8")
          expected = []
          for section in data.get("sections") or []:
              for graph in section.get("graphs") or []:
                  if not _is_renderable_geogebra_graph(graph):
                      continue
                  local = str(graph.get("graph_local_path") or "").strip()
                  if local:
                      expected.append(local.replace("\\", "/"))

          missing = [path for path in expected if path not in tex]
          print(f"GeoGebra LaTeX inclusion: {len(expected)-len(missing)}/{len(expected)} graph(s) present.")
          if missing:
              raise SystemExit("GeoGebra graph(s) missing from LaTeX source: " + ", ".join(missing))
          PY

      - name: Mark LaTeX ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":48,\"stage\":\"Source LaTeX générée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Compile PDF — first pass
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex/production
        run: |
          ENGINE="$(cat native-tex-engine 2>/dev/null || echo lualatex)"
          "$ENGINE" -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=. document.tex

      - name: Mark PDF compilation progress
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            -H "x-aurore-document-id: $DOCUMENT_ID" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":68,\"stage\":\"Compilation PDF — première passe terminée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Compile PDF — final pass
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex/production
        run: |
          ENGINE="$(cat native-tex-engine 2>/dev/null || echo lualatex)"
          "$ENGINE" -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=. document.tex
          python3 - <<'PY'
          from pathlib import Path
          pdf = Path("document.pdf")
          if not pdf.is_file() or pdf.stat().st_size == 0:
              raise SystemExit("TeX engine did not produce a PDF")
          if pdf.read_bytes()[:5] != b"%PDF-":
              raise SystemExit("Invalid PDF header")
          print(f"Generated PDF: {pdf.stat().st_size} bytes")
          PY

      - name: Mark PDF ready for upload
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":86,\"stage\":\"PDF compilé — vérification terminée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Upload PDF and commit database URL
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            -X POST \
            -H "Content-Type: application/pdf" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            -H "x-aurore-document-id: $DOCUMENT_ID" \
            -H "x-aurore-commit: true" \
            --data-binary @infra/lualatex/production/document.pdf \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-upload-v2" \
            -o infra/lualatex/production/upload-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("infra/lualatex/production/upload-response.json").read_text())
          if not data.get("ok") or data.get("mode") != "commit" or data.get("database_updated") is not True:
              raise SystemExit(f"Production upload failed: {data}")
          print(f"LuaLaTeX production commit OK: document={data['generated_document_id']} bytes={data['bytes']}")
          print(f"PDF path: {data['pdf_path']}")
          PY

      - name: Mark PDF completed
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":100,\"stage\":\"PDF terminé et enregistré dans Aurore\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Mark document failed after renderer failure
        if: failure() && hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"error\":\"GitHub Actions run $GITHUB_RUN_ID failed\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-fail" \
            -o infra/lualatex/production/failure-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("infra/lualatex/production/failure-response.json").read_text())
          if not data.get("ok"):
              raise SystemExit(f"Failure cleanup failed: {data}")
          print(f"LuaLaTeX failure recorded: document={data['document_id']} action={data['action']} failure_count={data['failure_count']} automatic_retry={data.get('automatic_retry')}")
          PY

      - name: Create downloadable ZIP package
        if: success() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/document.pdf') != ''
        working-directory: infra/lualatex/production
        run: |
          DOCUMENT_ID="$(cat document-id)"
          mkdir -p "aurora-document-$DOCUMENT_ID"
          cp document.pdf "aurora-document-$DOCUMENT_ID/"
          cp document.tex "aurora-document-$DOCUMENT_ID/"
          cp document.json "aurora-document-$DOCUMENT_ID/"
          [ -f document.visual-qa.json ] && cp document.visual-qa.json "aurora-document-$DOCUMENT_ID/" || true
          [ -f upload-response.json ] && cp upload-response.json "aurora-document-$DOCUMENT_ID/" || true
          if [ -d assets ]; then cp -r assets "aurora-document-$DOCUMENT_ID/"; fi
          printf 'Aurore — document %s\\n' "$DOCUMENT_ID" > "aurora-document-$DOCUMENT_ID/README.txt"
          printf 'PDF final + source LuaLaTeX + contenu JSON + QA + ressources utilisées.\\n' >> "aurora-document-$DOCUMENT_ID/README.txt"
          zip -r "aurora-document-$DOCUMENT_ID.zip" "aurora-document-$DOCUMENT_ID" >/dev/null
          test -s "aurora-document-$DOCUMENT_ID.zip"
          echo "ZIP prêt : aurora-document-$DOCUMENT_ID.zip"

      - name: Upload rendered PDF artifact
        if: always() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/document.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aurora-lualatex-production-${{ hashFiles('infra/lualatex/production/document-id') }}
          path: infra/lualatex/production/document.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Upload downloadable ZIP artifact
        if: success() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/aurora-document-*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aurora-document-zip-${{ hashFiles('infra/lualatex/production/document-id') }}
          path: infra/lualatex/production/aurora-document-*.zip
          if-no-files-found: error
          retention-days: 7


            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":22,\"stage\":\"Contenu et ressources récupérés\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Ensure LuaLaTeX and Aurore fonts
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          NEED_UPDATE=0
          if ! command -v lualatex >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if ! kpsewhich montserrat.sty >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if ! kpsewhich qrcode.sty >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if ! command -v rsvg-convert >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if [ "$NEED_UPDATE" = "1" ]; then
            sudo apt-get update
            sudo apt-get install -y texlive-luatex texlive-lang-french texlive-latex-extra texlive-fonts-extra texlive-pictures librsvg2-bin
          fi
          lualatex --version
          rsvg-convert --version
          kpsewhich montserrat.sty
          kpsewhich qrcode.sty

      - name: Smoke-test renderer and title layout
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          rm -rf production/smoke
          mkdir -p production/smoke
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          import render_document
          from render_document import render

          data = {
              "title": "Document de validation Aurore",
              "introduction": "Test de composition éditoriale.",
              "subject": "Mathématiques",
              "level": "Terminale",
              "class_name": "Classe de validation",
              "version": "1",
              "learning_objectives": ["Objectif de contrôle"],
              "_aurore_document": {
                  "id": 999999,
                  "created_at": "2026-09-21T00:00:00Z",
                  "version": 1,
                  "title": "Document de validation Aurore",
              },
              "sections": [
                  {
                      "title": "Section test",
                      "content": ["Contenu de validation."],
                      "graphs": [],
                      "graphics": [
                          {"kind": "separator", "style": "leaf_branch", "title": "Séparateur SVG Aurore"}
                      ],
                      "exercises": [],
                  }
              ],
          }

          tex = render(data)
          required = [
              r"\AuroreTitleBlock",
              r"width=1.74cm,height=1.74cm",
              r"width=1.42cm,height=1.42cm",
              r"\raisebox{0.62cm}[2.30cm][0pt]{\qrcode",
          ]
          for marker in required:
              if marker not in tex:
                  raise SystemExit(f"Renderer smoke check failed: missing {marker}")
          from render_document import _is_renderable_geogebra_graph, render_graphs, normalize_math
          matrix_regressions = [
              (r"\begin{pmatrix}x\y\end{pmatrix}", r"\begin{pmatrix}x\\y\end{pmatrix}"),
              (r"\begin{pmatrix}x&1\y&2\end{pmatrix}", r"\begin{pmatrix}x&1\\y&2\end{pmatrix}"),
          ]
          for raw, expected in matrix_regressions:
              actual = normalize_math(raw)
              if actual != expected:
                  raise SystemExit(f"Renderer smoke check failed: matrix row repair produced {actual!r}, expected {expected!r}")

          command_regressions = [
              (r"\fracrac3{(x-1)^2}", r"\frac3{(x-1)^2}"),
              (r"lim_{x\to1}sqrt{x^2+1}", r"\lim_{x\to1}\sqrt{x^2+1}"),
              (r"left(1,2\right)", r"\left(1,2\right)"),
              (r"ln(1+x)+infty", r"\ln(1+x)+\infty"),
              (r"ainmathbb R", r"a\in\mathbb R"),
              (r"mathbb Rsetminus{a}", r"\mathbb R\setminus{a}"),
              (r"widetilde f(a)=quad x", r"\widetilde f(a)=\quad x"),
              ("\f" + "rac{1}{2}", r"\frac{1}{2}"),
              ("\t" + "ext{x}", r"\text{x}"),
          ]
          for raw, expected in command_regressions:
              actual = normalize_math(raw)
              if actual != expected:
                  raise SystemExit(f"Renderer smoke check failed: math command repair produced {actual!r}, expected {expected!r}")

          dangling_math_regressions = [
              ("N. Pour $$", r"N. Pour \$\$"),
          ]
          for raw, expected in dangling_math_regressions:
              actual = render_document.inline(raw)
              if actual != expected:
                  raise SystemExit(f"Renderer smoke check failed: dangling math delimiter repair produced {actual!r}, expected {expected!r}")

          json_control_regressions = [
              ("x\n" + "eq1", r"x\neq1"),
              ("x\n" + "otin A", r"x\notin A"),
              ("x\n" + "abla f", r"x\nabla f"),
          ]
          for raw, expected in json_control_regressions:
              actual = normalize_math(raw)
              if actual != expected:
                  raise SystemExit(f"Renderer smoke check failed: JSON control escape repair produced {actual!r}, expected {expected!r}")
          from render_document import render_aurore_graphics
          import tempfile
          with tempfile.TemporaryDirectory() as td:
              generated = render_aurore_graphics([{"kind":"separator","style":"leaf_branch","title":"Smoke SVG Aurore"}], Path(td) / "assets" / "aurore", {"primary":"#8B5CF6","secondary":"#C084FC","strong":"#6D28D9"})
              if not generated or not (Path(td) / "assets" / "aurore" / "aurore-graphic-1.svg").is_file() or not (Path(td) / "assets" / "aurore" / "aurore-graphic-1.pdf").is_file():
                  raise SystemExit("Renderer smoke check failed: Aurore SVG/PDF asset missing")
          regression_graph = {
              "style": "geogebra",
              "geogebra_image_source": "geogebra",
              "geogebra_image_path": "aurora-content/test/graph.png",
              "graph_local_path": "assets/geogebra-test.png",
              "expression": "y = 0",
              "points": [[0, 0], [1, 0]],
          }
          if not _is_renderable_geogebra_graph(regression_graph):
              raise SystemExit("Renderer smoke check failed: schema-valid GeoGebra graph was rejected")
          graph_tex = "\n".join(render_graphs([regression_graph]))
          expected_graph = r"\includegraphics[width=0.92\linewidth,height=10.5cm,keepaspectratio]{assets/geogebra-test.png}"
          if expected_graph not in graph_tex:
              raise SystemExit("Renderer smoke check failed: GeoGebra graph was not emitted")

          Path("production/smoke/document.tex").write_text(tex, encoding="utf-8")
          PY
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=production/smoke production/smoke/document.tex
          test -s production/smoke/document.pdf
          test "$(head -c 5 production/smoke/document.pdf)" = "%PDF-"

      - name: Mark renderer ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":32,\"stage\":\"Moteur LuaLaTeX et ressources prêts\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Fetch official Aurore site logo (non-blocking fallback)
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          mkdir -p infra/lualatex/production/assets
          if curl --fail --silent --show-error --retry 4 --retry-delay 2 --location --max-time 20 \
            "https://pub-0433751d08eb49fcafb7355ef0bf42ab.r2.dev/site-logo-auraster" \
            -o infra/lualatex/production/assets/aurore-logo.png && \
            test -s infra/lualatex/production/assets/aurore-logo.png; then
            echo "Logo Aurore récupéré depuis le stockage public R2."
          else
            echo "::warning::Logo R2 indisponible. Utilisation du logo du dépôt GitHub comme repli."
            cp apple-touch-icon.png infra/lualatex/production/assets/aurore-logo.png
          fi
          test -s infra/lualatex/production/assets/aurore-logo.png
          file infra/lualatex/production/assets/aurore-logo.png

      - name: Render LaTeX source
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 render_document.py production/document.json -o production/document.tex
          test -s production/document.tex
          grep -q '\\documentclass' production/document.tex

      - name: Persist visual QA
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          DOCUMENT_ID="$(cat production/document-id)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          qa_path=Path("production/document.visual-qa.json")
          if not qa_path.is_file():
              raise SystemExit("Visual QA sidecar missing")
          qa=json.loads(qa_path.read_text(encoding="utf-8"))
          body={"document_id":int(Path("production/document-id").read_text().strip()),"progress":40,"stage":"QA visuelle Wikimedia","metadata_patch":{"visual_qa":qa}}
          Path("production/visual-qa-progress.json").write_text(json.dumps(body,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(qa,ensure_ascii=False))
          PY
          curl --fail --silent --show-error -X POST             -H "Content-Type: application/json"             -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN"             --data-binary @production/visual-qa-progress.json             "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null
          echo "Visual QA persisted in Supabase."

      - name: Verify GeoGebra inclusion in LaTeX source
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from render_document import _is_renderable_geogebra_graph

          data = json.loads(Path("production/document.json").read_text())
          tex = Path("production/document.tex").read_text(encoding="utf-8")
          expected = []
          for section in data.get("sections") or []:
              for graph in section.get("graphs") or []:
                  if not _is_renderable_geogebra_graph(graph):
                      continue
                  local = str(graph.get("graph_local_path") or "").strip()
                  if local:
                      expected.append(local.replace("\\", "/"))

          missing = [path for path in expected if path not in tex]
          print(f"GeoGebra LaTeX inclusion: {len(expected)-len(missing)}/{len(expected)} graph(s) present.")
          if missing:
              raise SystemExit("GeoGebra graph(s) missing from LaTeX source: " + ", ".join(missing))
          PY

      - name: Mark LaTeX ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":48,\"stage\":\"Source LaTeX générée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Compile PDF — first pass
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex/production
        run: |
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=. document.tex

      - name: Mark PDF compilation progress
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            -H "x-aurore-document-id: $DOCUMENT_ID" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":68,\"stage\":\"Compilation PDF — première passe terminée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Compile PDF — final pass
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex/production
        run: |
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=. document.tex
          python3 - <<'PY'
          from pathlib import Path
          pdf = Path("document.pdf")
          if not pdf.is_file() or pdf.stat().st_size == 0:
              raise SystemExit("LuaLaTeX did not produce a PDF")
          if pdf.read_bytes()[:5] != b"%PDF-":
              raise SystemExit("Invalid PDF header")
          print(f"Generated PDF: {pdf.stat().st_size} bytes")
          PY

      - name: Mark PDF ready for upload
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":86,\"stage\":\"PDF compilé — vérification terminée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Upload PDF and commit database URL
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            -X POST \
            -H "Content-Type: application/pdf" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            -H "x-aurore-document-id: $DOCUMENT_ID" \
            -H "x-aurore-commit: true" \
            --data-binary @infra/lualatex/production/document.pdf \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-upload-v2" \
            -o infra/lualatex/production/upload-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("infra/lualatex/production/upload-response.json").read_text())
          if not data.get("ok") or data.get("mode") != "commit" or data.get("database_updated") is not True:
              raise SystemExit(f"Production upload failed: {data}")
          print(f"LuaLaTeX production commit OK: document={data['generated_document_id']} bytes={data['bytes']}")
          print(f"PDF path: {data['pdf_path']}")
          PY

      - name: Mark PDF completed
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":100,\"stage\":\"PDF terminé et enregistré dans Aurore\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Mark document failed after renderer failure
        if: failure() && hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"error\":\"GitHub Actions run $GITHUB_RUN_ID failed\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-fail" \
            -o infra/lualatex/production/failure-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("infra/lualatex/production/failure-response.json").read_text())
          if not data.get("ok"):
              raise SystemExit(f"Failure cleanup failed: {data}")
          print(f"LuaLaTeX failure recorded: document={data['document_id']} action={data['action']} failure_count={data['failure_count']} automatic_retry={data.get('automatic_retry')}")
          PY

      - name: Create downloadable ZIP package
        if: success() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/document.pdf') != ''
        working-directory: infra/lualatex/production
        run: |
          DOCUMENT_ID="$(cat document-id)"
          mkdir -p "aurora-document-$DOCUMENT_ID"
          cp document.pdf "aurora-document-$DOCUMENT_ID/"
          cp document.tex "aurora-document-$DOCUMENT_ID/"
          cp document.json "aurora-document-$DOCUMENT_ID/"
          [ -f document.visual-qa.json ] && cp document.visual-qa.json "aurora-document-$DOCUMENT_ID/" || true
          [ -f upload-response.json ] && cp upload-response.json "aurora-document-$DOCUMENT_ID/" || true
          if [ -d assets ]; then cp -r assets "aurora-document-$DOCUMENT_ID/"; fi
          printf 'Aurore — document %s\\n' "$DOCUMENT_ID" > "aurora-document-$DOCUMENT_ID/README.txt"
          printf 'PDF final + source LuaLaTeX + contenu JSON + QA + ressources utilisées.\\n' >> "aurora-document-$DOCUMENT_ID/README.txt"
          zip -r "aurora-document-$DOCUMENT_ID.zip" "aurora-document-$DOCUMENT_ID" >/dev/null
          test -s "aurora-document-$DOCUMENT_ID.zip"
          echo "ZIP prêt : aurora-document-$DOCUMENT_ID.zip"

      - name: Upload rendered PDF artifact
        if: always() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/document.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aurora-lualatex-production-${{ hashFiles('infra/lualatex/production/document-id') }}
          path: infra/lualatex/production/document.pdf
          if-no-files-found: error
          retention-days: 3

      - name: Upload downloadable ZIP artifact
        if: success() && hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/aurora-document-*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aurora-document-zip-${{ hashFiles('infra/lualatex/production/document-id') }}
          path: infra/lualatex/production/aurora-document-*.zip
          if-no-files-found: error
          retention-days: 7


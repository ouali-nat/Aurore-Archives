name: Aurora LuaLaTeX production renderer

on:
  push:
    paths:
      - ".github/workflows/aurora-lualatex-production.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-lualatex-production
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://tdeotqfsbvouresfhkab.supabase.co
      AURORA_LUALATEX_RENDER_TOKEN: ${{ secrets.AURORA_LUALATEX_RENDER_TOKEN }}

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Validate renderer secret
        run: test -n "$AURORA_LUALATEX_RENDER_TOKEN"

      - name: Validate renderer Python syntax
        working-directory: infra/lualatex
        run: python3 -m py_compile render_document.py

      - name: Claim next generated document
        run: |
          mkdir -p infra/lualatex/production
          curl --fail --silent --show-error \
            --header "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-next" \
            -o infra/lualatex/production/claim.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("infra/lualatex/production/claim.json").read_text())
          if not data.get("ok"):
              raise SystemExit(f"Claim failed: {data}")
          if not data.get("pending"):
              print("No generated document waiting for LuaLaTeX.")
              Path("infra/lualatex/production/no-work").write_text("true")
              raise SystemExit(0)
          doc = data["document"]
          print(f"Claimed document {doc['id']}: {doc['title']}")
          Path("infra/lualatex/production/document-id").write_text(str(doc["id"]))
          PY

      - name: Mark queue processing
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":5,\"stage\":\"Document pris en charge par LuaLaTeX\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Fetch claimed document JSON
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error \
            --header "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-source?document_id=$DOCUMENT_ID" \
            -o infra/lualatex/production/document-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path("infra/lualatex/production/document-response.json").read_text())
          document = src.get("document")
          if not document or "content_json" not in document:
              raise SystemExit("Source endpoint did not return document.content_json")
          payload = json.loads(Path("infra/lualatex/production/document-response.json").read_text())
          content = document["content_json"] if isinstance(document["content_json"], dict) else {}
          existing_identity = content.get("_aurore_document") if isinstance(content.get("_aurore_document"), dict) else {}
          content["_aurore_document"] = {
              **existing_identity,
              "id": int(document["id"]),
              "created_at": document.get("created_at"),
              "version": int(document.get("version") or 1),
              "title": document.get("title"),
          }
          graph_assets = payload.get("graph_assets") or []
          if graph_assets:
              from urllib.request import urlopen
              assets_dir = Path("infra/lualatex/production/assets")
              assets_dir.mkdir(parents=True, exist_ok=True)
              for asset in graph_assets:
                  si = int(asset["section_index"])
                  gi = int(asset["graph_index"])
                  url = str(asset["url"])
                  ext = Path(str(asset.get("path") or "")).suffix or ".png"
                  local = assets_dir / f"graph-{si+1}-{gi+1}{ext}"
                  with urlopen(url, timeout=30) as response:
                      local.write_bytes(response.read())
                  content["sections"][si]["graphs"][gi]["graph_local_path"] = str(local.relative_to(Path("infra/lualatex/production")))
                  print(f"Fetched GeoGebra asset: {local}")
          Path("infra/lualatex/production/document.json").write_text(
              json.dumps(content, ensure_ascii=False, indent=2)
          )
          print(f"Fetched {document['id']}: {document['title']} (GeoGebra assets: {len(graph_assets)})")
          PY

      - name: Detect missing GeoGebra assets
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("production/document.json").read_text())
          from render_document import _is_renderable_geogebra_graph as valid

          def ready(g):
              path=str(g.get("geogebra_image_path") or "").strip()
              source=str(g.get("geogebra_image_source") or "").lower()
              version=int(g.get("geogebra_renderer_version") or 0)
              if not path or source!="geogebra": return False
              return version >= 3
          missing=0
          total=0
          for s in data.get("sections") or []:
              for g in s.get("graphs") or []:
                  if valid(g):
                      total+=1
                      missing+=0 if ready(g) else 1
          print(f"GeoGebra préflight: {total-missing}/{total} asset(s) prêts; {missing} manquant(s).")
          if missing:
              Path("production/geogebra-required").write_text(str(missing))
          else:
              Path("production/geogebra-required").unlink(missing_ok=True)
          PY

      - name: Render missing GeoGebra assets server-side
        if: hashFiles('infra/lualatex/production/document-id') != '' && hashFiles('infra/lualatex/production/geogebra-required') != ''
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          DOCUMENT_ID="$DOCUMENT_ID" node infra/geogebra/render_missing_graphs.mjs

      - name: Verify GeoGebra assets before LaTeX
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("production/document.json").read_text())
          from render_document import _is_renderable_geogebra_graph as valid

          def ready(g):
              path=str(g.get("geogebra_image_path") or "").strip()
              source=str(g.get("geogebra_image_source") or "").lower()
              version=int(g.get("geogebra_renderer_version") or 0)
              if not path or source!="geogebra": return False
              return version >= 3
          missing=[]
          total=0
          index=0
          for s in data.get("sections") or []:
              for g in s.get("graphs") or []:
                  if valid(g):
                      total+=1
                      if not ready(g): missing.append(index)
                  index+=1
          print(f"GeoGebra vérification: {total-len(missing)}/{total} asset(s) prêts.")
          if missing:
              raise SystemExit("GeoGebra asset(s) manquant(s) avant LuaLaTeX: "+",".join(str(x+1) for x in missing))
          PY

      - name: Mark source ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":15,\"stage\":\"Contenu et ressources récupérés\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Ensure LuaLaTeX and Aurore fonts
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          NEED_UPDATE=0
          if ! command -v lualatex >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if ! kpsewhich montserrat.sty >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if ! kpsewhich qrcode.sty >/dev/null 2>&1; then NEED_UPDATE=1; fi
          if [ "$NEED_UPDATE" = "1" ]; then
            sudo apt-get update
            sudo apt-get install -y texlive-luatex texlive-lang-french texlive-latex-extra texlive-fonts-extra texlive-pictures
          fi
          lualatex --version
          kpsewhich montserrat.sty
          kpsewhich qrcode.sty


      - name: Smoke-test renderer and title layout
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          rm -rf production/smoke
          mkdir -p production/smoke
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from render_document import render

          data = {
              "title": "Document de validation Aurore",
              "introduction": "Test de composition éditoriale.",
              "subject": "Mathématiques",
              "level": "Terminale",
              "class_name": "Classe de validation",
              "version": "1",
              "learning_objectives": ["Objectif de contrôle"],
              "_aurore_document": {
                  "id": 999999,
                  "created_at": "2026-09-21T00:00:00Z",
                  "version": 1,
                  "title": "Document de validation Aurore",
              },
              "sections": [
                  {
                      "title": "Section test",
                      "content": ["Contenu de validation."],
                      "graphs": [],
                      "exercises": [],
                  }
              ],
          }

          tex = render(data)
          required = [
              r"\AuroreTitleBlock",
              r"width=1.74cm,height=1.74cm",
              r"width=1.42cm,height=1.42cm",
              r"\raisebox{0.44cm}[2.30cm][0pt]{\qrcode",
          ]
          for marker in required:
              if marker not in tex:
                  raise SystemExit(f"Renderer smoke check failed: missing {marker}")
          from render_document import _is_renderable_geogebra_graph, render_graphs
          regression_graph = {
              "style": "geogebra",
              "geogebra_image_source": "geogebra",
              "geogebra_image_path": "aurora-content/test/graph.png",
              "graph_local_path": "assets/geogebra-test.png",
              "expression": "y = 0",
              "points": [[0, 0], [1, 0]],
          }
          if not _is_renderable_geogebra_graph(regression_graph):
              raise SystemExit("Renderer smoke check failed: schema-valid GeoGebra graph was rejected")
          graph_tex = "\n".join(render_graphs([regression_graph]))
          expected_graph = r"\includegraphics[width=0.92\linewidth,height=10.5cm,keepaspectratio]{assets/geogebra-test.png}"
          if expected_graph not in graph_tex:
              raise SystemExit("Renderer smoke check failed: GeoGebra graph was not emitted")

          Path("production/smoke/document.tex").write_text(tex, encoding="utf-8")
          PY
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=production/smoke production/smoke/document.tex
          test -s production/smoke/document.pdf
          test "$(head -c 5 production/smoke/document.pdf)" = "%PDF-"

      - name: Mark renderer ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":25,\"stage\":\"Moteur LuaLaTeX et ressources prêts\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Fetch official Aurore site logo
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          mkdir -p infra/lualatex/production/assets
          curl --fail --silent --show-error --location \
            "https://pub-0433751d08eb49fcafb7355ef0bf42ab.r2.dev/site-logo-auraster" \
            -o infra/lualatex/production/assets/aurore-logo.png
          test -s infra/lualatex/production/assets/aurore-logo.png
          file infra/lualatex/production/assets/aurore-logo.png

      - name: Render LaTeX source
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 render_document.py production/document.json -o production/document.tex
          test -s production/document.tex
          grep -q '\\documentclass' production/document.tex

      # Regression guard: a persisted GeoGebra asset must survive through the generated TeX source.
      - name: Verify GeoGebra inclusion in LaTeX source
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from render_document import _is_renderable_geogebra_graph

          data = json.loads(Path("production/document.json").read_text())
          tex = Path("production/document.tex").read_text(encoding="utf-8")
          expected = []
          for section in data.get("sections") or []:
              for graph in section.get("graphs") or []:
                  if not _is_renderable_geogebra_graph(graph):
                      continue
                  local = str(graph.get("graph_local_path") or "").strip()
                  if local:
                      expected.append(local.replace("\\", "/"))

          missing = [path for path in expected if path not in tex]
          print(f"GeoGebra LaTeX inclusion: {len(expected)-len(missing)}/{len(expected)} graph(s) present.")
          if missing:
              raise SystemExit("GeoGebra graph(s) missing from LaTeX source: " + ", ".join(missing))
          PY

      - name: Mark LaTeX ready
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":35,\"stage\":\"Source LaTeX générée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null

      - name: Compile PDF — first pass
        if: hashFiles('infra/lualatex/production/document-id') != ''
        working-directory: infra/lualatex/production
        run: |
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=. document.tex

      - name: Mark PDF compilation progress
        if: hashFiles('infra/lualatex/production/document-id') != ''
        run: |
          DOCUMENT_ID="$(cat infra/lualatex/production/document-id)"
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            -H "x-aurore-document-id: $DOCUMENT_ID" \
            --data "{\"document_id\":$DOCUMENT_ID,\"progress\":60,\"stage\":\"Compilation PDF — première passe terminée\"}" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-progress" >/dev/null
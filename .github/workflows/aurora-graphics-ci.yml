name: Aurore graphics renderer CI

on:
  push:
    paths:
      - "infra/lualatex/aurore_svg.py"
      - "infra/lualatex/render_document.py"
      - "infra/lualatex/fixtures/graphics-lab.json"
      - "infra/lualatex/tests/**"
      - ".github/workflows/aurora-graphics-ci.yml"
  pull_request:
    paths:
      - "infra/lualatex/aurore_svg.py"
      - "infra/lualatex/render_document.py"
      - "infra/lualatex/fixtures/graphics-lab.json"
      - "infra/lualatex/tests/**"
      - ".github/workflows/aurora-graphics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install graphics and LuaLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y             librsvg2-bin             texlive-luatex             texlive-latex-extra             texlive-lang-french \
            poppler-utils

      - name: Validate Python syntax
        run: python3 -m py_compile infra/lualatex/aurore_svg.py infra/lualatex/render_document.py infra/lualatex/tests/test_aurore_svg.py

      - name: Run Aurore SVG unit tests
        run: python3 -m unittest discover -s infra/lualatex/tests -p 'test_*.py' -v

      - name: Render graphics laboratory
        working-directory: infra/lualatex
        run: |
          rm -rf /tmp/aurore-graphics-lab
          mkdir -p /tmp/aurore-graphics-lab
          python3 render_document.py fixtures/graphics-lab.json -o /tmp/aurore-graphics-lab/document.tex
          test -s /tmp/aurore-graphics-lab/document.tex
          test -n "$(find /tmp/aurore-graphics-lab/assets/aurore -name '*.svg' -type f | head -n 1)"
          test -n "$(find /tmp/aurore-graphics-lab/assets/aurore -name '*.pdf' -type f | head -n 1)"

      - name: Compile graphics laboratory PDF
        working-directory: /tmp/aurore-graphics-lab
        run: |
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=. document.tex
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error -output-directory=. document.tex
          test -s document.pdf
          test "$(head -c 5 document.pdf)" = "%PDF-"
          pdfinfo document.pdf | grep -q '^Pages:'
          echo "Graphics laboratory PDF OK: $(stat -c '%s' document.pdf) bytes"

      - name: Upload graphics laboratory artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurore-graphics-laboratory
          path: /tmp/aurore-graphics-lab/document.pdf
          if-no-files-found: error
          retention-days: 7

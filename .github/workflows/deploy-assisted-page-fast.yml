name: Deploy Aurora assisted-page-fast

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/aurora-assisted-page-fast/**"
      - ".github/workflows/deploy-assisted-page-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy assisted-page-fast
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy aurora-assisted-page-fast --project-ref tdeotqfsbvouresfhkab

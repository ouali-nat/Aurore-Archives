name: Apply PDF editorial safety patch

on:
  push:
    branches:
      - fix/pdf-editorial-safe-20260921

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch renderer and LuaLaTeX queue guards
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          renderer = Path("infra/lualatex/render_document.py")
          queue = Path("supabase/functions/aurora-lualatex-next/index.ts")

          if not renderer.exists():
              raise SystemExit(f"Missing renderer: {renderer}")
          if not queue.exists():
              raise SystemExit(f"Missing LuaLaTeX queue function: {queue}")

          r = renderer.read_text(encoding="utf-8")
          q = queue.read_text(encoding="utf-8")

          old_objectives = '''    r"\\section*{Objectifs d'apprentissage}",
    r"\\addcontentsline{toc}{section}{Objectifs d'apprentissage}",
    r"\\begin{itemize}",
]
for item in data.get("learning_objectives", []):
    lines.append(r"\\item " + inline(item))
lines.append(r"\\end{itemize}")
'''
          new_objectives = '''    learning_objectives = [
        str(item).strip()
        for item in data.get("learning_objectives", []) or []
        if str(item).strip()
    ]
    if learning_objectives:
        lines.extend([
            r"\\section*{Objectifs d'apprentissage}",
            r"\\addcontentsline{toc}{section}{Objectifs d'apprentissage}",
            r"\\begin{itemize}",
        ])
        for item in learning_objectives:
            lines.append(r"\\item " + inline(item))
        lines.append(r"\\end{itemize}")
'''
          if old_objectives not in r:
              raise SystemExit("Renderer guard target not found; aborting without changes.")
          r = r.replace(old_objectives, new_objectives, 1)

          if r.count("Ce que tu vas apprendre") != 1:
              raise SystemExit("Expected exactly one 'Ce que tu vas apprendre' label.")
          r = r.replace("Ce que tu vas apprendre", "À découvrir", 1)

          if r.count("moteur de composition : LuaLaTeX · ") != 1:
              raise SystemExit("Expected exactly one LuaLaTeX engine mention in the colophon.")
          r = r.replace("moteur de composition : LuaLaTeX · ", "", 1)

          if r.count("Scanne le QR code pour vérifier dynamiquement l'état public de cette édition.") != 1:
              raise SystemExit("Expected QR instruction text not found.")
          r = r.replace(
              "Scanne le QR code pour vérifier dynamiquement l'état public de cette édition.",
              "Veuillez scanner le QR code pour vérifier cette édition.",
              1,
          )

          gray_qr = '    r"    {\\sffamily\\scriptsize\\color{gray}La destination publique et l\'intégrité du PDF sont contrôlées au moment du scan.\\par\\medskip}",\n'
          if r.count(gray_qr) != 1:
              raise SystemExit("Expected verbose QR verification line not found.")
          r = r.replace(gray_qr, "", 1)

          resolver_line = '        r"      Le QR ne pointe ni vers l\'administration ni vers un stockage interne. Il retrouvera automatiquement la publication publique lorsque celle-ci existe.",\n'
          if r.count(resolver_line) != 1:
              raise SystemExit("Expected resolver explanation line not found.")
          r = r.replace(resolver_line, "", 1)

          old_rights = '''        r"    \\begin{tcolorbox}[colback=aurorepale,colframe=aurorebase!18!white,arc=10pt,boxrule=.35pt,left=9pt,right=9pt,top=6pt,bottom=6pt]",
        r"      {\\sffamily\\scriptsize\\bfseries\\color{auroredeep}DROITS \\& RÉUTILISATION}\\par\\smallskip",
        r"      {\\sffamily\\scriptsize\\color{auroredeep}Cette édition constitue une création éditoriale d'Aurore. Les connaissances générales et formules restent réutilisables sous réserve des droits applicables aux éléments tiers.\\par}",
        r"      {\\sffamily\\scriptsize\\color{gray}Les ressources tierces conservent leurs propres licences et conditions d'utilisation.\\par}",
        r"    \\end{tcolorbox}",
'''
          new_rights = '''        r"    \\begin{tcolorbox}[colback=aurorepale,colframe=aurorebase!22!white,arc=11pt,boxrule=.45pt,left=10pt,right=10pt,top=8pt,bottom=8pt]",
        r"      {\\sffamily\\small\\bfseries\\color{auroredeep}DROITS \\& RÉUTILISATION}\\par\\medskip",
        r"      {\\sffamily\\footnotesize\\color{auroredeep}Cette édition constitue une création éditoriale d'Aurore. Les connaissances générales et formules restent réutilisables sous réserve des droits applicables aux éléments tiers.\\par}",
        r"      {\\sffamily\\footnotesize\\color{gray}Les ressources tierces conservent leurs propres licences et conditions d'utilisation.\\par}",
        r"    \\end{tcolorbox}",
'''
          if old_rights not in r:
              raise SystemExit("Rights block target not found; aborting without changes.")
          r = r.replace(old_rights, new_rights, 1)

          # Defense in depth: reject non-structured renderer input before LaTeX generation.
          guard_anchor = "def render(data):\n"
          render_guard = '''def _has_usable_content_json(data):
    if not isinstance(data, dict):
        return False
    if not str(data.get("title") or "").strip():
        return False
    if not str(data.get("introduction") or "").strip():
        return False
    sections = data.get("sections")
    if not isinstance(sections, list) or not sections:
        return False
    return any(
        isinstance(section, dict)
        and isinstance(section.get("content"), list)
        and any(str(item or "").strip() for item in section.get("content", []))
        for section in sections
    )


'''
          if "def _has_usable_content_json(data):" not in r:
              if r.count(guard_anchor) != 1:
                  raise SystemExit("Renderer render() anchor not found.")
              r = r.replace(guard_anchor, render_guard + guard_anchor, 1)
          render_start = "def render(data):\n"
          render_replacement = '''def render(data):
    if not _has_usable_content_json(data):
        raise ValueError("LuaLaTeX source rejected: structured content_json is required")
'''
          if r.count(render_start) != 1:
              raise SystemExit("Renderer render() definition changed unexpectedly.")
          # Avoid stacking the guard on reruns.
          existing_after = r[r.index(render_start):r.index(render_start)+220]
          if "structured content_json is required" not in existing_after:
              r = r.replace(render_start, render_replacement, 1)

          # Queue guard: include content_json, then select only documents with usable structured content.
          select_old = 'select("id,title,status,pdf_path,pdf_url,version,metadata,updated_at,created_at")'
          select_new = 'select("id,title,status,pdf_path,pdf_url,version,metadata,content_json,updated_at,created_at")'
          if select_old in q:
              q = q.replace(select_old, select_new, 1)
          elif select_new not in q:
              raise SystemExit("LuaLaTeX queue select target not found.")

          helper = '''const hasUsableContentJson=(value:unknown)=>{
  const d=value&&typeof value==="object"?value as Record<string,unknown>:{};
  const sections=Array.isArray(d.sections)?d.sections:[];
  return String(d.title??"").trim().length>0 &&
    String(d.introduction??"").trim().length>0 &&
    sections.length>0 &&
    sections.some((s:any)=>Array.isArray(s?.content)&&s.content.some((x:any)=>String(x??"").trim().length>0));
};
'''
          if "const hasUsableContentJson=" not in q:
              anchor='const out=(x:unknown,s=200)=>new Response(JSON.stringify(x),{status:s,headers:{...C,"Content-Type":"application/json"}});\n'
              if q.count(anchor)!=1:
                  raise SystemExit("LuaLaTeX queue helper anchor not found.")
              q=q.replace(anchor,anchor+helper,1)

          old_pred = '''const doc=(candidates||[]).find((row:any)=>{const m=row?.metadata&&typeof row.metadata==="object"?row.metadata:{};return m.lualatex_requested===true||m.lualatex_status==="queued"});'''
          new_pred = '''const doc=(candidates||[]).find((row:any)=>{const m=row?.metadata&&typeof row.metadata==="object"?row.metadata:{};return (m.lualatex_requested===true||m.lualatex_status==="queued")&&hasUsableContentJson(row?.content_json)});'''
          if old_pred in q:
              q=q.replace(old_pred,new_pred,1)
          elif new_pred not in q:
              raise SystemExit("LuaLaTeX queue predicate target not found.")

          renderer.write_text(r,encoding="utf-8")
          queue.write_text(q,encoding="utf-8")

          subprocess.run(["python3","-m","py_compile",str(renderer)],check=True)
          subprocess.run(["git","diff","--check"],check=True)

          names=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          allowed={"infra/lualatex/render_document.py","supabase/functions/aurora-lualatex-next/index.ts",".github/workflows/_apply_pdf_editorial_safe_patch.yml"}
          unexpected=set(names)-allowed
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {sorted(unexpected)}")

          print("Renderer and queue guard patch validated.")
          print("\n".join(names))

      - name: Remove one-shot patch workflow
        run: rm -f .github/workflows/_apply_pdf_editorial_safe_patch.yml

      - name: Commit and push the surgical patch
        run: |
          git config user.name "Aurore Automation"
          git config user.email "actions@users.noreply.github.com"
          git add infra/lualatex/render_document.py supabase/functions/aurora-lualatex-next/index.ts .github/workflows/_apply_pdf_editorial_safe_patch.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: harden PDF source and modernize editorial colophon"
          git push origin HEAD:fix/pdf-editorial-safe-20260921

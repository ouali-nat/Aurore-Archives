name: Aurora LuaLaTeX production dispatcher

on:
  push:
    paths:
      - ".github/workflows/aurora-lualatex-production-dispatcher.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      manual_wake:
        description: "Réveil manuel du moteur LuaLaTeX"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

jobs:
  render:
    uses: ./.github/workflows/aurora-lualatex-production.yml
    with:
      manual_wake: true
    secrets: inherit


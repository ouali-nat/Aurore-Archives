name: PDF LaTeX Supabase bridge test

on:
  push:
    branches:
      - pdf-lualatex-test
  workflow_dispatch:
    inputs:
      document_id:
        description: "aurora_generated_documents.id to render"
        required: true
        default: "21"
      commit:
        description: "Write generated PDF path/url to the database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bridge-test:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://tdeotqfsbvouresfhkab.supabase.co
      AURORA_LUALATEX_RENDER_TOKEN: ${{ secrets.AURORA_LUALATEX_RENDER_TOKEN }}
      DOCUMENT_ID: ${{ inputs.document_id || '21' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bridge secret
        run: |
          test -n "$AURORA_LUALATEX_RENDER_TOKEN"

      - name: Fetch document JSON from Supabase
        run: |
          mkdir -p infra/lualatex/bridge
          curl --fail --silent --show-error \
            --header "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-source?document_id=$DOCUMENT_ID" \
            -o infra/lualatex/bridge/document-response.json
          test -s infra/lualatex/bridge/document-response.json

      - name: Extract content_json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path("infra/lualatex/bridge/document-response.json").read_text(encoding="utf-8"))
          if "document" not in src or "content_json" not in src["document"]:
              raise SystemExit("Supabase response does not contain document.content_json")

          document = src["document"]
          Path("infra/lualatex/bridge/document.json").write_text(
              json.dumps(document["content_json"], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Fetched document {document['id']}: {document['title']}")
          print(f"version={document['version']} status={document['status']}")
          PY

      - name: Ensure LuaLaTeX
        run: |
          if ! command -v lualatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y texlive-luatex texlive-lang-french texlive-latex-extra
          fi
          lualatex --version

      - name: Render fetched Supabase JSON
        working-directory: infra/lualatex
        run: |
          python3 render_document.py bridge/document.json -o bridge/document.tex
          test -s bridge/document.tex
          grep -q '\\documentclass' bridge/document.tex
          grep -q '\\section' bridge/document.tex

      - name: Compile fetched Supabase document
        working-directory: infra/lualatex
        run: |
          set +e
          lualatex -no-shell-escape -interaction=nonstopmode -halt-on-error \
            -output-directory=bridge bridge/document.tex
          rc=$?
          set -e

          python3 - <<'PY'
          from pathlib import Path

          pdf = Path("bridge/document.pdf")
          if not pdf.is_file() or pdf.stat().st_size == 0:
              raise SystemExit("LuaLaTeX did not produce a non-empty PDF")

          if pdf.read_bytes()[:5] != b"%PDF-":
              raise SystemExit("Generated file is not a valid PDF header")

          print(f"Valid PDF generated: {pdf} ({pdf.stat().st_size} bytes)")
          PY

          echo "LuaLaTeX exit code: $rc"

          if grep -nE '^!' bridge/document.log; then
            echo "LuaLaTeX reported a fatal TeX error."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "LuaLaTeX returned $rc, but the PDF is valid and the log contains no fatal TeX error; continuing."
          fi

      - name: Upload PDF to Supabase Storage (test mode)
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/pdf" \
            -H "x-aurore-render-token: $AURORA_LUALATEX_RENDER_TOKEN" \
            -H "x-aurore-document-id: $DOCUMENT_ID" \
            -H "x-aurore-commit: ${{ inputs.commit || 'false' }}" \
            --data-binary @infra/lualatex/bridge/document.pdf \
            "$SUPABASE_URL/functions/v1/aurora-lualatex-upload-v2" \
            -o infra/lualatex/bridge/upload-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("infra/lualatex/bridge/upload-response.json").read_text(encoding="utf-8"))
          commit = "${{ inputs.commit || 'false' }}" == "true"
          expected_mode = "commit" if commit else "test"
          if not data.get("ok") or data.get("mode") != expected_mode:
              raise SystemExit(f"Supabase upload failed: {data}")
          if data.get("database_updated") is not commit:
              raise SystemExit(f"Unexpected database_updated value: {data}")
          print(f"Supabase upload OK: mode={data['mode']} path={data['pdf_path']} bytes={data['bytes']}")

      - name: Upload bridge test artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurore-lualatex-supabase-bridge-${{ inputs.document_id || '21' }}
          path: infra/lualatex/bridge/document.pdf
          retention-days: 3

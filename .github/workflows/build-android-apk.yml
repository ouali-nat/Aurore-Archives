name: Build Aurore Section Archives Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'js/aurore-personal-actions.js'
      - 'index.html'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Aurore Section Archives
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Generate the configured Aurore Android app and sync native plugins
        working-directory: android-app
        run: |
          test -f capacitor.config.json
          grep -q '"appId": "app.vercel.aurore_section_archivescom.twa"' capacitor.config.json
          grep -q '"appName": "Aurore"' capacitor.config.json
          grep -q '"url": "https://aurore-section-archivescom.vercel.app"' capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Apply Aurore app icon and verify app identity
        working-directory: android-app
        run: |
          RES=android/app/src/main/res
          IM="$(command -v magick || command -v convert)"
          test -f icon.png
          rm -rf "$RES/mipmap-anydpi-v26"
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${entry%%:*}"
            size="${entry##*:}"
            mkdir -p "$RES/mipmap-$name"
            "$IM" icon.png -resize "${size}x${size}" "$RES/mipmap-$name/ic_launcher.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_round.png"
            rm -f "$RES/mipmap-$name/ic_launcher_foreground.png"
          done
          grep -R -q 'app.vercel.aurore_section_archivescom.twa' android/app/src/main
          grep -R -q 'Aurore' android/app/src/main/res/values/strings.xml
          echo "Identité Android vérifiée : Aurore / app.vercel.aurore_section_archivescom.twa"

      - name: Build Aurore debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Aurore-Section-Archives.apk"

      - name: Upload the Aurore APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurore-Section-Archives-APK
          path: Aurore-Section-Archives.apk
          if-no-files-found: error
          retention-days: 14
